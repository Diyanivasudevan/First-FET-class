<html>
<head>
<style>
.box {
    width: 100px;
    height: 100px;
    animation: colorChange 3s infinite;
}

@keyframes colorChange {
    0%   { background-color: red; }
    50%  { background-color: yellow; }
    100% { background-color: blue; }
}

}
</style>
</head>
<body>
<h1>Hello</h1>
<div class ="box">move</div>
</body>
</html>
